name: Validate Repository Structure

on: [push, pull_request]

jobs:
  validate-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for required files
        run: |
          if [ ! -f "docs/ERD.png" ] && [ ! -f "docs/ERD.pdf" ]; then echo "ERD not found!" && exit 1; fi
          if [ ! -f "docs/API_Endpoint_Plan.md" ] && [ ! -f "docs/API_Endpoint_Plan.pdf" ]; then echo "API Endpoint Plan not found!" && exit 1; fi
          if [ ! -f "docs/RaceDay_Schema.sql" ]; then echo "SQL script not found!" && exit 1; fi
          echo "All required files are present."
